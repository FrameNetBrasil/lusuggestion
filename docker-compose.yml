services:
  framenet-lu-generator:
    build: .
    image: framenet-lu-generator
    container_name: framenet-lu-api
    ports:
      - "5000:5000"
    volumes:
      # Mount models directory to persist downloaded models
      - ./models:/srv/models
      # Optional: mount local prompts for testing
      - ./parsed_prompt.txt:/opt/app/parsed_prompt.txt:ro
    environment:
      - MODEL_PATH=/srv/models/models--bartowski--Meta-Llama-3.1-8B-Instruct-GGUF/snapshots/bf5b95e96dac0462e2a09145ec66cae9a3f12067/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
      - PORT=5000
      - HOST=0.0.0.0
      - PYTHONPATH=/opt/app
    deploy:
      resources:
        # Reserve GPU resources if available
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: framenet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - framenet-lu-generator
    restart: unless-stopped
    profiles:
      - production

# Networks
networks:
  default:
    name: framenet-network

# Volumes for persistent data
volumes:
  models:
    driver: local